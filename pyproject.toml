[project]
name = "sparse-wsi-vit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p-adema", email = "peter.adema@student.uva.nl" }
]
requires-python = "==3.12.*"
dependencies = [
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "h5py>=3.16.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "openslide-bin>=4.0.0.13",
    "openslide-python>=1.4.3",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "polars>=1.39.3",
    "pytest>=9.0.3",
    "pytorch-lightning>=2.6.1",
    "rich>=14.3.3",
    "ruff>=0.15.10",
    "scikit-learn>=1.8.0",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.26.0",
    "transformers>=5.5.4",
    "ty>=0.0.30",
    #    "vit-5",
    "wandb>=0.25.1",
    "nystrom-attention>=0.0.13",
    "nvidia-cutlass-dsl[cu13]>=4.5.1", # snellius has CUDA13, change if local needs cu12
    "cuda-python>=13.2.0",
    "flash-attn",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
# Adjust down if your machine is low on RAM (This uses up to around 90GB)
flash-attn = { MAX_JOBS = "8" }

# Or if compilation is very unlikely to succeed, try uncommenting this line instead:
#flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }



